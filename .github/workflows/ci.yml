name: CI

# Vérifie chaque push : types, tests unitaires et build de production.
# Le rapport est rangé dans une référence cachée `refs/ci/<branche>` (ni branche ni tag : Vercel l'ignore).
# Seule la branche `main` (le site en ligne) fait échouer le workflow ; les branches de travail ne font que produire le rapport.
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sonde
        run: |
          { npm view @imgly/background-removal dist-tags versions time.modified dependencies peerDependencies --json; echo; curl -sI "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm" | head -5; curl -sI "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.6.0/+esm" | head -3; npm view @imgly/background-removal@1.7.0 dist.unpackedSize; curl -s "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.d.ts" | head -120; } > ci-report.txt 2>&1 || true
      - name: Ranger le rapport
        if: always()
        run: |
          mkdir -p /tmp/out && cp ci-report.txt /tmp/out/ && { [ -d dist ] && cp -r dist /tmp/out/ || true; }
          cd /tmp/out && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci/${GITHUB_REF_NAME}"
      - if: steps.checks.outputs.failed == '1' && github.ref_name == 'main'
        run: exit 1
