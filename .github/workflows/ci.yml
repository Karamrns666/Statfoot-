name: CI

# Vérifie chaque push : types, tests unitaires et build de production.
# Le rapport est rangé dans une référence cachée `refs/ci/<branche>` (ni branche ni tag : Vercel l'ignore).
# Seule la branche `main` (le site en ligne) fait échouer le workflow ; les branches de travail ne font que produire le rapport.
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, tests et build
        id: checks
        run: |
          set +e
          { echo "## tsc"; npx tsc -b; echo "exit=$?"; } > ci-report.txt 2>&1
          { echo "## tests"; npx vitest run; echo "exit=$?"; } >> ci-report.txt 2>&1
          { echo "## build"; npx vite build; echo "exit=$?"; } >> ci-report.txt 2>&1
          # build de test branché sur un faux Supabase local (http://localhost:54321) — jamais déployé
          npx vite build --mode e2e --outDir dist-e2e > /dev/null 2>&1 || true
          cat ci-report.txt
          if grep -q "exit=[1-9]" ci-report.txt; then echo "failed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Tests de bout en bout (Chromium, Firefox, WebKit) + Lighthouse
        # informatif : ne bloque pas le déploiement ; résultats dans e2e-report.txt et test-results/
        continue-on-error: true
        run: |
          set +e
          npm i --no-save @playwright/test@1.63.0 > /dev/null 2>&1
          npx playwright install --with-deps chromium firefox webkit > /dev/null 2>&1
          npx playwright test -c e2e/playwright.config.mjs --update-snapshots=missing > e2e-report.txt 2>&1
          echo "exit=$?" >> e2e-report.txt
          # Lighthouse (téléphone simulé) sur le build servi localement
          (npx vite preview --port 4173 --strictPort > /dev/null 2>&1 &) ; sleep 4
          for p in / /classement /joueurs /trophees; do
            n=$(echo "$p" | tr '/' '_'); npx -y lighthouse@12 "http://localhost:4173$p" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh$n.json" > /dev/null 2>&1
            node -e "const r=require('./lh$n.json');console.log('LIGHTHOUSE build $p', Object.values(r.categories).map(c=>c.title+' '+Math.round(c.score*100)).join(' · '))" >> e2e-report.txt 2>&1
          done
          # et sur le site en ligne (vraies données)
          for p in / /classement /joueurs; do
            n=$(echo "$p" | tr '/' '_'); npx -y lighthouse@12 "https://www.ardentia-foot.com$p" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lhprod$n.json" > /dev/null 2>&1
            node -e "const r=require('./lhprod$n.json');console.log('LIGHTHOUSE prod $p', Object.values(r.categories).map(c=>c.title+' '+Math.round(c.score*100)).join(' · '))" >> e2e-report.txt 2>&1
          done
          tail -60 e2e-report.txt
      - name: Ranger le rapport
        if: always()
        run: |
          mkdir -p /tmp/out && cp ci-report.txt /tmp/out/ && { [ -d dist ] && cp -r dist /tmp/out/ || true; } && { [ -d dist-e2e ] && cp -r dist-e2e /tmp/out/ || true; }
          cp e2e-report.txt /tmp/out/ 2>/dev/null || true
          cp -r test-results /tmp/out/ 2>/dev/null || true
          cp -r e2e/__screenshots__ /tmp/out/screenshots 2>/dev/null || true
          cp lh*.json /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "CI ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci/${GITHUB_REF_NAME}"
      - if: steps.checks.outputs.failed == '1' && github.ref_name == 'main'
        run: exit 1
