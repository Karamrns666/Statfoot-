name: Surveillance du site

# Toutes les 15 minutes : le site répond-il ? la base est-elle joignable ? trop d'erreurs chez les visiteurs ?
# sauvegarde de la nuit faite ? En cas de problème, une « issue » GitHub « Alerte site » est ouverte : GitHub envoie
# alors un e-mail au propriétaire du dépôt. Elle est refermée automatiquement quand tout est revenu à la normale.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Contrôle
        id: c
        run: |
          SITE=https://www.ardentia-foot.com
          problems=""
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/") || code=000
          [ "$code" = "200" ] || problems="$problems\n- Le site ne répond pas correctement (code $code)."
          h=$(curl -s --max-time 25 "$SITE/api/health" || echo '{}')
          echo "$h"
          db=$(echo "$h" | jq -r '.db // false'); errs=$(echo "$h" | jq -r '.errors_15min // 0'); bk=$(echo "$h" | jq -r '.last_backup // ""')
          [ "$db" = "true" ] || problems="$problems\n- La base de données Supabase ne répond pas."
          [ "$errs" -lt 10 ] || problems="$problems\n- $errs erreurs JavaScript chez les visiteurs en 15 minutes (voir Admin → Paramètres → Erreurs du site)."
          if [ -n "$bk" ]; then
            d=$(echo "$bk" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            if [ -n "$d" ] && [ $(( ( $(date +%s) - $(date -d "$d" +%s) ) / 86400 )) -ge 2 ]; then problems="$problems\n- Dernière sauvegarde de la base : $d (plus de 2 jours)."; fi
          fi
          { echo "problems<<EOF"; printf "%b" "$problems"; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Alerte (ouverture ou fermeture)
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.c.outputs.problems }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Alerte site"' --json number -q '.[0].number')
          if [ -n "$(echo "$PROBLEMS" | tr -d '[:space:]')" ]; then
            body=$(printf "Problème détecté le %s (UTC) sur https://www.ardentia-foot.com :\n%s\n\nCette alerte se ferme toute seule quand tout est revenu à la normale." "$(date -u '+%d/%m/%Y %H:%M')" "$PROBLEMS")
            # une seule alerte ouverte à la fois (pas un e-mail toutes les 15 minutes)
            [ -n "$open" ] || gh issue create -R "$GITHUB_REPOSITORY" --title "Alerte site — ardentia-foot.com" --body "$body"
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Tout est revenu à la normale ($(date -u '+%d/%m/%Y %H:%M') UTC)."
          fi
