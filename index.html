    <!-- Données du site demandées dès le chargement de la page, en parallèle du JavaScript (premier affichage plus rapide).
         Visiteurs uniquement (un admin connecté passe par son propre jeton). La clé « anon » est publique par nature. -->
    <script>
      (function () {
        try {
          var u = '%VITE_SUPABASE_URL%', k = '%VITE_SUPABASE_ANON_KEY%'
          if (!u || u.charAt(0) === '%' || !k || k.charAt(0) === '%' || localStorage.getItem('statfoot:cloud-session')) return
          // site en ligne : un seul instantané compressé, servi en cache par Vercel (/api/snapshot)
          if (!/^(localhost|127\.)/.test(location.hostname)) {
            window.__mblSnapshot = fetch('/api/snapshot').then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null })
            return
          }
          var q = '/rest/v1/entity_rows?select=entity,id,data,deleted,updated_at&deleted=is.false&order=updated_at.asc,entity.asc,id.asc&limit=1000&offset=0'
          window.__mblPrefetch = { path: q, res: fetch(u.replace(/\/$/, '') + q, { headers: { apikey: k, Authorization: 'Bearer ' + k } }).then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null }) }
        } catch (e) { /* pas de préchargement */ }
      })()
    </script>
    <!-- statistiques de visite Vercel (sans cookie) -->
    <script>
      if (/ardentia-foot\.com$/.test(location.hostname)) { var s = document.createElement('script'); s.defer = true; s.src = '/_vercel/insights/script.js'; document.head.appendChild(s) }
    </script>

        <div style="margin-top:28px;height:4px;width:160px;border-radius:4px;background:linear-gradient(90deg,#F85A00,#F26B1D);opacity:.85"></div>
      </div>
    </div>

    <script>if (/^\/(admin|tv|live)/.test(location.pathname)) { var sh = document.getElementById('app-shell'); if (sh) sh.remove() }</script>
