name: CI

# Vérifie chaque push : types, tests unitaires et build de production.
# Le rapport (et le site construit) est publié sur la branche `ci-results/<branche>` pour consultation.
on:
  push:
    branches-ignore: ['ci-results/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, tests et build
        id: checks
        run: |
          set +e
          { echo "## tsc"; npx tsc -b; echo "exit=$?"; } > ci-report.txt 2>&1
          { echo "## tests"; npx vitest run; echo "exit=$?"; } >> ci-report.txt 2>&1
          { echo "## build"; npx vite build; echo "exit=$?"; } >> ci-report.txt 2>&1
          cat ci-report.txt
          if grep -q "exit=[1-9]" ci-report.txt; then echo "failed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Publier le rapport
        if: always()
        run: |
          BR="ci-results/${GITHUB_REF_NAME}"
          mkdir -p /tmp/out && cp ci-report.txt /tmp/out/ && [ -d dist ] && cp -r dist /tmp/out/ || true
          cd /tmp/out && git init -q && git checkout -q -b "$BR"
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "CI ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
      - if: steps.checks.outputs.failed == '1'
        run: exit 1
